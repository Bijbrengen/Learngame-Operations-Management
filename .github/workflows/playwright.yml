name: Playwright Acceptatietests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Desktop en kritieke mobiele Chromium-stromen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      # CI draait zowel de statische app als de exact uitgecheckte Engine lokaal,
      # zodat SDK-contracten niet afhankelijk zijn van de productiedeployment.
      LEARNGAME_OM_URL: http://127.0.0.1:47113/
      LEERPRET_API_URL: http://127.0.0.1:47111/api

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7
        with:
          # De historische pariteitspoort leest de geverifieerde baselinecommit.
          fetch-depth: 0

      - name: LeerpretEngine ophalen
        uses: actions/checkout@v7
        with:
          repository: Bijbrengen/LeerpretEngine
          ref: master
          path: LeerpretEngine
          ssh-key: ${{ secrets.LEERPRET_ENGINE_SSH_KEY }}
          persist-credentials: false

      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: LeerpretEngine/requirements.txt

      - name: Dependencies installeren
        run: |
          npm ci
          python -m pip install -r LeerpretEngine/requirements.txt

      - name: Lokale LeerpretEngine starten
        shell: bash
        working-directory: LeerpretEngine
        run: |
          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 47111 \
            > "${RUNNER_TEMP}/leerpret-engine.log" 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:47111/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "${RUNNER_TEMP}/leerpret-engine.log"
          exit 1

      - name: Chromium en systeemdependencies installeren
        run: npx playwright install --with-deps chromium

      - name: Device- en multiplayerregressies uitvoeren
        run: |
          npm run test:device
          npm run test:bridge
          npm run test:material-cart
          npm run test:spatial
          npm run test:parity-contract
          npm run test:multiplayer

      - name: Acceptatietests uitvoeren
        run: |
          npm run test:visual
          npm run test:visual:history-parity

      - name: Playwright-rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/leerpret-engine.log
          if-no-files-found: warn
          retention-days: 14
