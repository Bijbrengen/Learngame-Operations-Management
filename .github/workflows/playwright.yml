name: Playwright Acceptatietests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Desktop en kritieke mobiele Chromium-stromen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      # Poort 47913 is de expliciete CI-preview: de statische app draait lokaal,
      # maar runtime-config.js kiest de productie-Engine. Normale lokale
      # ontwikkeling blijft op 47113 en gebruikt Engine-poort 47111.
      LEARNGAME_OM_URL: http://127.0.0.1:47913/

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7
        with:
          # De historische pariteitspoort leest de geverifieerde baselinecommit.
          fetch-depth: 0

      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Chromium en systeemdependencies installeren
        run: npx playwright install --with-deps chromium

      - name: Device- en multiplayerregressies uitvoeren
        run: |
          npm run test:device
          npm run test:bridge
          npm run test:material-cart
          npm run test:spatial
          npm run test:parity-contract
          npm run test:multiplayer

      - name: Acceptatietests uitvoeren
        run: |
          npm run test:visual
          npm run test:visual:history-parity

      - name: Playwright-rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
