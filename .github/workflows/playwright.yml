name: Playwright Acceptatietests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Desktop en kritieke mobiele Chromium-stromen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      LEARNGAME_OM_URL: http://127.0.0.1:47113/

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: LeerpretEngine ophalen
        uses: actions/checkout@v7
        with:
          repository: Bijbrengen/LeerpretEngine
          path: LeerpretEngine

      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Python instellen
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: LeerpretEngine/requirements.txt

      - name: Engine-dependencies installeren
        run: python -m pip install -r LeerpretEngine/requirements.txt

      - name: Engine starten
        run: |
          cd LeerpretEngine
          python -m uvicorn app.main:app --host 127.0.0.1 --port 47111 > ../leerpret-engine.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:47111/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../leerpret-engine.log
          exit 1

      - name: Chromium en systeemdependencies installeren
        run: npx playwright install --with-deps chromium

      - name: Acceptatietests uitvoeren
        run: npm run test:visual

      - name: Playwright-rapport bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            leerpret-engine.log
          if-no-files-found: warn
          retention-days: 14
